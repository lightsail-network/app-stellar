name: Swap functional tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
  
jobs:
  job_functional_tests:
    uses: LedgerHQ/app-exchange/.github/workflows/reusable_swap_functional_tests.yml@develop
    with:
      branch_for_stellar: ${{ github.ref }}
      test_filter: '"XLM or xlm or Stellar or stellar"'
      repo_for_stellar: ${{ github.repository }}
      # TEMPORARY: drop these two lines once the fix lands upstream.
      # app-exchange's Stellar test helper appends a stray `sig.len = 0` after
      # `tx.ext`, so what it sends is not a signature base. The device used to
      # sign it anyway; now that unreviewed trailing bytes are rejected, every
      # valid swap case fails against upstream's test code.
      repo_for_exchange: overcat/app-exchange
      branch_for_exchange: fix/stellar-signature-base